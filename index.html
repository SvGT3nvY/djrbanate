<script>
(()=>{
  const g=id=>document.getElementById(id),V=JSON.parse(g('vault').textContent);
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),S=crypto.subtle;
  const say=(t,e)=>{g('msg').textContent=t;g('msg').className=e?'err':'';};
  async function unlock(code){
    const norm=code.toUpperCase().replace(/[^A-Z0-9]/g,'');
    const base=await S.importKey('raw',new TextEncoder().encode(norm),'PBKDF2',false,['deriveKey']);
    const D=await S.deriveKey({name:'PBKDF2',salt:b(V.salt),iterations:V.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    let K=null;
    for(const e of V.keys){try{K=await S.importKey('raw',await S.decrypt({name:'AES-GCM',iv:b(e.iv)},D,b(e.ct)),'AES-GCM',false,['decrypt']);break;}catch(_){}}
    if(!K)return null;
    const P=JSON.parse(new TextDecoder().decode(await S.decrypt({name:'AES-GCM',iv:b(V.iv)},K,b(V.ct))));
    let html=P.html;
    await Promise.all(Object.entries(P.files).map(async([p,f])=>{
      const r=await fetch(f.f+'?v='+(V.id||''));if(!r.ok)throw new Error('missing');
      const u=new Uint8Array(await r.arrayBuffer());let d;
      try{d=await S.decrypt({name:'AES-GCM',iv:u.slice(0,12)},K,u.slice(12));}catch(_){throw new Error('mismatch');}
            const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(new Blob([d],{type:f.t}));});
      html=html.split(p).join(url);
    }));
    return html;
  }
  async function go(code,remember,auto){
    g('btn').disabled=true;say('Unlocking…');
    try{
      const html=await unlock(code);
      if(!html){say('Invalid access code.',1);g('btn').disabled=false;if(auto)try{localStorage.removeItem('djrb_code');}catch(_){}return;}
      if(remember)try{localStorage.setItem('djrb_code',code);}catch(_){}
      document.open();document.write(html);document.close();
    }catch(e){
      try{localStorage.removeItem('djrb_code');}catch(_){}
      say(e.message==='missing'?'Some site files are missing. Upload the whole "assets" folder again.':e.message==='mismatch'?'The site files do not match. Upload index.html and the assets folder together from the same zip.':'Something went wrong. Please try again.',1);
      g('btn').disabled=false;}
  }
  g('f').addEventListener('submit',e=>{e.preventDefault();go(g('code').value,g('rem').checked,false);});
  g('mail').addEventListener('click',e=>{
    const to='djduane16@gmail.com',sub='Portfolio access request',body='Hi Duane, I would like to request an access code for your portfolio.\n\nName:\nReason:';
    const q='to='+encodeURIComponent(to)+'&subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);
    const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),android=/Android/i.test(ua);
    if(!ios&&!android){e.preventDefault();window.open('https://mail.google.com/mail/?view=cm&fs=1&'+q,'_blank','noopener');return;}
    if(ios){e.preventDefault();const t=Date.now();location.href='googlegmail:///co?'+q;
      setTimeout(()=>{if(!document.hidden&&Date.now()-t<2500)location.href='mailto:'+to+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);},1200);}
  });
  try{const c=localStorage.getItem('djrb_code');if(c)go(c,false,true);}catch(_){}
})();
</script>
